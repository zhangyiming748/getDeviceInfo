name: verify-windows

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    name: 构建并采集 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 静态检查与编译
        shell: pwsh
        run: |
          go vet ./...
          go build -trimpath -ldflags "-s -w -H windowsgui" -o getDeviceInfo.exe .
          Get-Item .\getDeviceInfo.exe | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: 运行并采集
        shell: pwsh
        run: |
          $csv = Join-Path $env:RUNNER_TEMP 'device.csv'
          $p = Start-Process -FilePath .\getDeviceInfo.exe -ArgumentList '-no-ui', '-out', $csv -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "程序退出码 $($p.ExitCode)" }
          if (-not (Test-Path $csv)) { throw '未生成 CSV 文件' }
          Get-Content $csv -Encoding UTF8 | Write-Host

      - name: 校验 CSV
        shell: pwsh
        run: |
          $csv = Join-Path $env:RUNNER_TEMP 'device.csv'
          $bytes = [System.IO.File]::ReadAllBytes($csv)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw 'CSV 缺少 UTF-8 BOM'
          }

          $lines = Get-Content $csv -Encoding UTF8
          if ($lines.Count -ne 2) { throw "CSV 应为表头 + 1 行数据，实际 $($lines.Count) 行" }

          $row = Import-Csv $csv -Encoding UTF8
          $cols = @($row.PSObject.Properties.Name)
          if ($cols.Count -ne 20) { throw "列数应为 20，实际 $($cols.Count)" }

          if ([string]::IsNullOrWhiteSpace($row.'电脑名称')) { throw '电脑名称为空' }
          if ([string]::IsNullOrWhiteSpace($row.'CPU型号')) { throw 'CPU型号为空' }
          if ($row.'CPU核心数' -notmatch '^\d+$' -or [int]$row.'CPU核心数' -le 0) {
            throw "CPU核心数异常：$($row.'CPU核心数')"
          }
          if ([double]$row.'内存大小(GB)' -le 0) { throw "内存大小异常：$($row.'内存大小(GB)')" }
          if ([string]::IsNullOrWhiteSpace($row.'显卡型号')) { throw '显卡型号为空' }
          if ($row.'MAC地址' -notmatch '([0-9A-F]{2}:){5}[0-9A-F]{2}') {
            throw "MAC地址格式异常：$($row.'MAC地址')"
          }
          if ($row.'IP地址' -notmatch '\d{1,3}(\.\d{1,3}){3}') { throw "IP地址异常：$($row.'IP地址')" }

          "### $env:RUNNER_OS 采集结果" | Add-Content $env:GITHUB_STEP_SUMMARY
          '' | Add-Content $env:GITHUB_STEP_SUMMARY
          '| 字段 | 值 |' | Add-Content $env:GITHUB_STEP_SUMMARY
          '| --- | --- |' | Add-Content $env:GITHUB_STEP_SUMMARY
          foreach ($c in $cols) {
            $v = [string]$row.$c
            $v = $v -replace '\|', '\|'
            if ($v.Length -gt 200) { $v = $v.Substring(0, 200) + '…' }
            "| $c | $v |" | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          Write-Host 'CSV 校验通过'

      - name: 上传 CSV
        uses: actions/upload-artifact@v4
        with:
          name: device-csv-${{ matrix.os }}
          path: ${{ runner.temp }}/device.csv
          if-no-files-found: error
